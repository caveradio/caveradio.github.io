<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Текстовий редактор</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #e9ecef;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            padding: 16px 20px;
            background-color: #fafbfc;
            border-bottom: 1px solid #e9ecef;
            align-items: center;
            flex-wrap: wrap;
        }
        .filename-input {
            flex: 1;
            min-width: 180px;
            padding: 8px 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            color: #495057;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .filename-input:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
        }
        .btn-group {
            display: flex;
            gap: 8px;
        }
        .btn {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-primary {
            background-color: #2b6cb0;
            color: #ffffff;
        }
        .btn-primary:hover {
            background-color: #2c5282;
        }
        .btn-secondary {
            background-color: #edf2f7;
            color: #4a5568;
        }
        .btn-secondary:hover {
            background-color: #e2e8f0;
        }
        .btn-danger {
            background-color: #fff5f5;
            color: #e53e3e;
        }
        .btn-danger:hover {
            background-color: #fed7d7;
        }
        #file-input {
            display: none;
        }
        .editor-container {
            padding: 20px;
        }
        textarea {
            width: 100%;
            height: 480px;
            padding: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #2d3748;
            resize: vertical;
            outline: none;
            background-color: #fafbfc;
            transition: border-color 0.2s, background-color 0.2s;
        }
        textarea:focus {
            border-color: #4a90e2;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }
        .footer-info {
            padding: 10px 20px 16px;
            font-size: 12px;
            color: #a0aec0;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="toolbar">
            <input type="text" id="filename" class="filename-input" value="note.txt" placeholder="Назва файлу">
            <div class="btn-group">
                <button class="btn btn-primary" onclick="saveFile()">Зберегти</button>
                <button class="btn btn-secondary" onclick="document.getElementById('file-input').click()">Відкрити</button>
                <button class="btn btn-danger" onclick="clearEditor()">Очистити</button>
            </div>
            <input type="file" id="file-input" accept=".txt,.md,.json,.csv,.html,.css,.js" onchange="loadFile(event)">
        </div>

        <div class="editor-container">
            <textarea id="text-area" placeholder="Почніть вводити текст..." oninput="updateStats()"></textarea>
        </div>

        <div class="footer-info">
            <span id="char-count">Символів: 0</span>
            <span>Кодування: UTF-8 (з BOM)</span>
        </div>
    </div>

    <script>
        function saveFile() {
            const text = document.getElementById('text-area').value;
            let filename = document.getElementById('filename').value.trim();
            
            if (!filename) {
                filename = 'note.txt';
            }

            // Додаємо BOM (Byte Order Mark) 0xEF, 0xBB, 0xBF для явного визначення UTF-8
            const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
            const blob = new Blob([bom, text], { type: 'text/plain;charset=utf-8' });
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            
            document.body.appendChild(link);
            link.click();
            
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }

        function loadFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('filename').value = file.name;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('text-area').value = e.target.result;
                updateStats();
            };
            reader.readAsText(file, 'UTF-8');
            
            event.target.value = '';
        }

        function clearEditor() {
            if (confirm('Очистити вміст редактора? Незбережені зміни будуть втрачені.')) {
                document.getElementById('text-area').value = '';
                document.getElementById('filename').value = 'note.txt';
                updateStats();
            }
        }

        function updateStats() {
            const text = document.getElementById('text-area').value;
            document.getElementById('char-count').innerText = `Символів: ${text.length}`;
        }
    </script>

</body>
</html>
